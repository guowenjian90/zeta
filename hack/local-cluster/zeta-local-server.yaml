apiVersion: gateway.networking.k8s.io/v1beta1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: triton-gw
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      containers:
      - name: triton
        image: nvcr.io/nvidia/tritonserver:22.08-py3
        ports:
        - containerPort: 8000
        volumeMounts:
          - mountPath: /models
            name: volume
        command: ["tritonserver"]
        args: ["--model-repository=/models", "--model-control-mode=none"]
      volumes:
      - name: volume
        hostPath:
          path: /model_repository
---
apiVersion: v1
kind: Service
metadata:
  name: triton
spec:
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: triton
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: text-recognition
spec:
  parentRefs:
  - name: triton-gw
    sectionName: http
  hostnames:
    - "localhost"
    - "zeta.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v2/models/text_recognition/infer
    backendRefs:
    - name: triton
      kind: Service
      port: 8000
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: text-detection
spec:
  parentRefs:
  - name: triton-gw
    sectionName: http
  hostnames:
    - "localhost"
    - "zeta.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v2/models/text_detection/infer
    backendRefs:
    - name: triton
      kind: Service
      port: 8000
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: model-management
spec:
  parentRefs:
  - name: triton-gw
    sectionName: http
  hostnames:
    - "localhost"
    - "zeta.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v2/repository
    backendRefs:
    - name: triton
      kind: Service
      port: 8000
