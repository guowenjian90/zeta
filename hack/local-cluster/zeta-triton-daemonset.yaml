apiVersion: v1
kind: Namespace
metadata:
  name: zeta
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: triton
  namespace: zeta
spec:
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      tolerations:
        # these tolerations are to have the daemonset runnable on control plane nodes
        # remove them if your control plane nodes should not run pods
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
      - name: triton
        image: nvcr.io/nvidia/tritonserver:22.08-py3
        ports:
        - containerPort: 8000
          hostPort: 8000
        volumeMounts:
          - mountPath: /models
            name: volume
        command: ["tritonserver"]
        args: ["--model-repository=/models", "--model-control-mode=explicit"]
        env:
        - name: KUBE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KUBE_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      volumes:
      - name: volume
        hostPath:
          path: /model_repository
